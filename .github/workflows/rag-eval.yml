name: RAG Eval Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        env:
          MOCK_LLM: "true"
          HF_HOME: ${{ runner.temp }}/hf
        run: pytest -q

      - name: Golden-set evaluation (CI gate)
        env:
          MOCK_LLM: "true"
          HF_HOME: ${{ runner.temp }}/hf
        run: ask-docs-eval --golden data/golden_set.jsonl --docs-dir data/sample_docs
